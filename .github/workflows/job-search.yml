name: Daily Job Search

on:
  schedule:
    - cron: '30 2 * * 1-5'
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search query (default: Product Operations Manager remote India)'
        required: false
        default: 'Product Operations Manager remote India'
      second_query:
        description: 'Second search query (optional)'
        required: false
        default: 'Business Intelligence Analyst remote India'

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas

      - name: Run job search
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p job_applications/searches

          QUERY="${{ github.event.inputs.search_query || 'Product Operations Manager remote India' }}"
          QUERY2="${{ github.event.inputs.second_query || 'Business Intelligence Analyst remote India' }}"

          {
          echo "========================================"
          echo "  DAILY JOB SEARCH - $(date)"
          echo "========================================"
          echo ""
          echo "--- Search 1: $QUERY ---"
          python job_agent.py --search "$QUERY" 2>&1 || true
          echo ""
          echo "--- Search 2: $QUERY2 ---"
          python job_agent.py --search "$QUERY2" 2>&1 || true
          echo ""
          echo "--- Search 3: Power BI Developer remote India ---"
          python job_agent.py --search "Power BI Developer remote India" 2>&1 || true
          echo ""
          echo "--- Search 4: Operations Manager remote India ---"
          python job_agent.py --search "Operations Manager remote India" 2>&1 || true
          echo ""
          echo "--- Search 5: Data Analyst remote India ---"
          python job_agent.py --search "Data Analyst remote India" 2>&1 || true
          echo ""
          echo "========================================"
          echo "  SEARCH COMPLETE"
          echo "========================================"
          } 2>&1 | tee job_applications/search_results.txt

      - name: Save search results artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-search-results-${{ github.run_id }}
          path: job_applications/
          retention-days: 30
          if-no-files-found: warn
